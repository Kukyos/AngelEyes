# Every threshold the engine uses. Never hard-code one in Python.
# Distances are metres on the ground plane (homography), or pixels scaled by
# person height for uncalibrated video (person_height_m).

model:
  weights: yolo11m-pose.pt   # in models/ (see README); m found the most people in our checks
  imgsz: 1280                # MEVA people are 30-80 px tall at 1080p, UMN is 320 px wide: 640 misses them
  live_imgsz: 640            # live cameras: people are close and large. At 1280 a 640x480 webcam frame is upscaled
                             # and one person comes out as 3-5 nested boxes (conf up to 0.94); at 640: 1 box in 60/60 frames
  conf: 0.1                  # low-score boxes feed ByteTrack's second association pass (keeps blurred
                             # runners on their track); new tracks still need tracker new_track_thresh
  draw_conf: 0.25            # untracked boxes below this are blurred but not drawn
  tracker: bytetrack.yaml
  sample_fps: 10             # frames analysed per second per camera
  live_sample_fps: 15        # live camera (--live): smoother view, still one camera per GPU
  motion_gate: 0             # mean abs frame difference (0-255) below which the last detections are reused; 0 = off.
                             # Off: on MEVA it skipped 17% of frames with small walkers in view (global mean
                             # misses a 60 px person), freezing boxes. Needs a per-block test before it can be on.

geometry:
  person_height_m: 1.7       # pixel-space fallback scale
  min_box_px: 28             # smaller people are drawn but not used for speed-based behaviours

output:
  width: 960                 # annotated video width, small videos are upscaled (height keeps aspect)
  crf: 28
  clip_pad_s: 5              # event clip buffer either side
  head_blur: true            # privacy: never turn off for anything that leaves the engine

track_repair:
  gap_s: 1.5
  max_dist_m: 2.5
  min_colour_similarity: 0.5
  close_gap_s: 1.0           # closer than this in time and close_dist_m in space joins even if colours differ
  close_dist_m: 1.5          # (a person who just fell is often lost mid-fall and has a different torso crop)

labels:                      # per-person activity label shown on the footage
  standing_max_mps: 0.4
  walking_max_mps: 2.2
  standing_max_mps_uncalibrated: 0.2   # pixel-space speeds read low (see sudden_run)
  walking_max_mps_uncalibrated: 1.0

loitering:
  radius_m: 3.0
  min_s: 60
  require_calibrated: true   # pixel-space dwell is meaningless on a close-up (someone at a desk "loiters" in 60 s)

fall:
  wide_ratio: 1.15           # box width / height once down
  upright_ratio: 1.2         # box height / width before the fall (people crouch or stumble first)
  torso_angle_deg: 55        # shoulder-hip line from vertical, when keypoints are visible
  max_hip_height: 0.7        # with a horizontal torso, hips at most this far up the box (bending over keeps them high)
  drop_window_s: 2.0         # upright -> down within this window (1.0 measured no different on UR Fall)
  down_s: 1.0                # must stay down this long (plan said 2 s; UR Fall clips end ~1.6 s after landing)
  max_height_ratio: 0.65     # box height once down vs. the upright box it fell from (the hip drop)
  shrunk_aspect: 0.8         # a shrunk box counts as down only if at least this wide (w/h); sitting stays narrower
  flicker_s: 0.4             # a "not down" blip shorter than this does not reset the timer

sudden_run:
  speed_mps: 2.5             # calibrated cameras (ground homography)
  prior_max_mps: 1.6         # walking pace in the 2 s before
  speed_mps_uncalibrated: 1.2       # pixel-space speeds read low under a steep camera angle;
  prior_max_mps_uncalibrated: 0.8   # these two were set from UMN scene 1 (see docs/EVALUATION.md)
  jump_ratio: 2.5            # and the speed must be this many times the person's own prior pace
  prior_s: 2.0
  hold_s: 0.6

following:
  delay_min_s: 1.0
  delay_max_s: 10.0
  dist_min_m: 2.0
  dist_max_m: 10.0
  path_match_m: 1.5          # follower's path vs the leader's delayed path
  min_s: 8.0
  min_turns: 1
  turn_deg: 35
  min_speed_mps: 0.5
  companion_dist_m: 1.5      # side by side counts as companions, not following

sos_pose:                    # whole-body distress pose: both wrists above the head
  hold_s: 1.5
  require_crossed: false
  min_kpt_conf: 0.4
  max_torso_angle_deg: 25    # standing upright; rejects overhead views where "above the head" means nothing

describe:                    # open-ended activity via a vision-language model (only with --live or --describe)
  interval_s: 4.0            # at most one call this often while someone is in view (~$0.0003-0.0005 per call measured)
  min_interval_s: 1.5        # sooner when someone enters or leaves
  frame_gap_s: 1.0           # the two moments compared in each close-up
  context_w: 768             # px width of the whole-view image in the composite
  crop_h: 288                # px height of each person close-up
  crop_pad: 0.15             # padding around the person's box
  max_people: 4              # close-ups per call
  timeout_s: 20
  enter_s: 2.5               # a new track must last this long before "entered the frame"
  enter_strong: 12           # and have this many confident detections (filters flickers, coats on hooks)
  leave_s: 3.0               # a person unseen this long, with no new track taking their place, has "left the frame"
  same_words: 0.5            # word overlap at which a new description counts as the same activity
