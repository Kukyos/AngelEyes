<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
<style>
:root {
  --bg: #000; --line: #1c1c1c; --text: #f2f2f2; --dim: #8a8a8a; --faint: #4a4a4a; --hover: #0e0e0e;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); overflow: hidden;
  -webkit-font-smoothing: antialiased; }
button { font: inherit; color: var(--dim); background: none; border: 0; cursor: pointer; padding: 6px 2px;
  transition: color .15s var(--ease); }
button:hover, button.on { color: var(--text); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header { height: 44px; display: flex; align-items: center; gap: 22px; padding: 0 18px; border-bottom: 1px solid var(--line); }
header .sp { flex: 1; }
#clock { font: 15px var(--mono); letter-spacing: .04em; }
#play { width: 22px; height: 22px; padding: 0; display: grid; place-items: center; }
#play svg { width: 12px; height: 12px; fill: currentColor; }
#dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .3s; }
#dot.ok { background: var(--text); }

#site { position: absolute; inset: 44px 0 48px 0; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(340px, 1fr); }
#grid { display: grid; gap: 2px; padding: 2px; align-content: center; min-height: 0; }
.tile { position: relative; aspect-ratio: 16/9; background: #050505; overflow: hidden; cursor: zoom-in;
  outline: 1px solid transparent; outline-offset: -1px; transition: outline-color .25s var(--ease); }
.tile:hover { outline-color: var(--faint); }
.tile video { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .4s var(--ease); }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
  padding: 14px 8px 5px; font: 11px var(--mono); color: var(--dim); background: linear-gradient(#0000, #000b); pointer-events: none; }
.tile .cap b { color: var(--text); font-weight: 500; }
.tile.off video { opacity: .12; }
.tile.alert { outline: 2px solid var(--text); outline-offset: -2px; animation: breathe 1.4s var(--ease) infinite alternate; }
@keyframes breathe { to { outline-color: #ffffff40; } }

aside { display: grid; grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); border-left: 1px solid var(--line); min-height: 0; }
#globe { position: relative; min-height: 0; background: #000; }
#globe .cesium-viewer-bottom, #globe .cesium-widget-credits { display: none !important; }
#globeNote { position: absolute; left: 10px; bottom: 8px; z-index: 2; font: 10px var(--mono); color: var(--faint); pointer-events: none; }
#home { position: absolute; right: 10px; top: 8px; z-index: 2; font-size: 11px; }
.head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 8px;
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
#feed { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); }
.list { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #222 transparent; }
.ev { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 8px 16px;
  cursor: pointer; transition: background .15s var(--ease); }
.ev:hover { background: var(--hover); }
.ev img { width: 72px; height: 40px; object-fit: cover; background: #111; filter: grayscale(1); }
.ev .t { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.ev.watch .t { color: var(--dim); font-weight: 500; }
.ev .m { font: 11px var(--mono); color: var(--dim); }
.ev .c { font: 11px var(--mono); color: var(--faint); }
.ev.new { animation: enter .5s var(--ease); }
@keyframes enter { from { opacity: 0; transform: translateY(-6px); background: #1a1a1a; } }
.empty { padding: 8px 16px; color: var(--faint); font-size: 12px; }

footer { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; border-top: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 18px; }
#track { position: relative; flex: 1; height: 28px; }
#track input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 2; }
#track .rail { position: absolute; left: 0; right: 0; top: 14px; height: 1px; background: var(--line); }
#track .done { position: absolute; left: 0; top: 14px; height: 1px; background: var(--dim); }
#track .tick { position: absolute; top: 8px; width: 1px; height: 13px; background: var(--faint); }
#track .tick.alert { background: var(--text); height: 17px; top: 6px; width: 2px; }
#track .knob { position: absolute; top: 10px; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: var(--text); }

#focus { position: absolute; inset: 44px 0 48px 0; z-index: 10; display: grid; grid-template-columns: minmax(0, 1fr) 360px;
  background: #000; opacity: 0; pointer-events: none; transform: scale(.985); transition: opacity .22s var(--ease), transform .22s var(--ease); }
#focus.show { opacity: 1; pointer-events: auto; transform: none; }
#focus video { width: 100%; height: 100%; object-fit: contain; background: #000; }
#focus .side { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

#toast { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column;
  gap: 6px; pointer-events: none; }
#toast div { background: var(--text); color: #000; padding: 7px 14px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; animation: drop .3s var(--ease); transition: opacity .4s; }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

#clips { position: absolute; inset: 44px 0 0 0; display: none; grid-template-columns: 280px minmax(0, 1fr) 360px; }
#clips.show { display: grid; }
#clips .col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
#clips .col:last-child { border-right: 0; border-left: 1px solid var(--line); }
.run { padding: 10px 16px; cursor: pointer; transition: background .15s var(--ease); border-left: 2px solid transparent; }
.run:hover { background: var(--hover); }
.run.sel { border-left-color: var(--text); background: var(--hover); }
.run .m { font: 11px var(--mono); color: var(--dim); }
#drop { margin: 4px 16px 12px; padding: 16px; border: 1px dashed var(--faint); text-align: center; color: var(--dim);
  font-size: 12px; cursor: pointer; transition: border-color .15s, color .15s; }
#drop:hover, #drop.over { border-color: var(--text); color: var(--text); }
#player { display: grid; place-items: center; min-height: 0; background: #000; color: var(--faint); }
#player video { max-width: 100%; max-height: 100%; }
#cam { position: absolute; inset: 44px 0 0 0; display: none; grid-template-columns: minmax(0, 1fr) 380px; }
#cam.show { display: grid; }
#camView { display: grid; grid-template-rows: auto minmax(0, 1fr); background: #000; min-height: 0; color: var(--faint); }
#srcForm { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
#srcForm input { font: inherit; color: var(--text); background: #0a0a0a; border: 1px solid var(--line); padding: 6px 8px; min-width: 0; }
#srcName { width: 110px; } #srcUrl { flex: 1; }
#srcForm select { font: inherit; color: var(--text); background: #0a0a0a; border: 1px solid var(--line); padding: 6px 4px; }
#srcMsg { padding: 0 12px; font-size: 12px; color: var(--dim); }
#camGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); grid-auto-rows: minmax(220px, 1fr); gap: 2px; min-height: 0; overflow: auto; }
#camGrid .empty { grid-column: 1 / -1; display: grid; place-items: center; }
.tile { position: relative; background: #000; display: grid; place-items: center; min-height: 0; cursor: pointer; outline: 1px solid var(--line); outline-offset: -1px; }
.tile.sel { outline: 2px solid var(--text); outline-offset: -2px; }
.tile img { max-width: 100%; max-height: 100%; display: block; }
.tile .lab { position: absolute; left: 8px; top: 6px; font: 11px var(--mono); background: #000a; padding: 2px 6px; }
.tile button { position: absolute; right: 6px; top: 6px; }
#camSide { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
.rules { padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
.rules form { display: flex; gap: 8px; }
.rules input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: #0a0a0a; border: 1px solid var(--line); padding: 6px 8px; }
.rules input:focus { outline: 1px solid var(--faint); }
.rules .pv { padding: 8px 0 0; font-size: 12px; color: var(--dim); }
.rules .pv b { color: var(--text); font-weight: 500; }
.rule { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 6px 0 0; font-size: 12px; }
.rule .s { grid-column: 1; font: 11px var(--mono); color: var(--faint); }
.now { padding: 4px 16px 16px; border-bottom: 1px solid var(--line); }
#nowList { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 40vh; overflow-y: auto; }
#nowList .empty { grid-column: 1 / -1; }
.who { border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; animation: enter .4s var(--ease);
  transition: opacity .3s var(--ease); }
.who.gone { opacity: .4; }
.who.alert { border-color: var(--text); }
.who .p { font: 12px var(--mono); color: var(--dim); display: flex; justify-content: space-between; }
.who .d { font-size: 17px; line-height: 1.25; font-weight: 500; }
.who .f { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.who .s { font: 11px var(--mono); color: var(--faint); }
.log { display: grid; grid-template-columns: 64px 36px 1fr; gap: 8px; padding: 6px 16px; font-size: 13px; animation: enter .4s var(--ease); }
.log .tm, .log .p { font: 11px var(--mono); color: var(--faint); padding-top: 2px; }
.log.alert { font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
#down { position: absolute; inset: 0; display: none; place-items: center; z-index: 30; background: #000; color: var(--dim);
  text-align: center; font: 13px var(--mono); line-height: 2; }
</style>
</head>
<body>
<header>
  <button id="tabCam" class="on">Camera</button>
  <button id="tabSite">Site</button>
  <button id="tabClips">Clips</button>
  <button id="tabSafe">SafeWalk</button>
  <span class="sp"></span>
  <span id="clock" class="num">--:--:--</span>
  <button id="play" title="Play / pause (space)"><svg viewBox="0 0 12 12"><path id="playIcon" d="M2 1h3v10H2zM7 1h3v10H7z"/></svg></button>
  <button id="spd" class="num">1×</button>
  <span id="dot" title="Live connection"></span>
</header>

<main id="site">
  <section id="grid"></section>
  <aside>
    <div id="globe"><button id="home">Recenter</button><div id="globeNote"></div></div>
    <div id="feed"><div class="head"><span>Events</span><span id="evCount" class="num"></span></div><div class="list" id="feedlist"></div></div>
  </aside>
</main>

<footer><div id="track"><div class="rail"></div><div class="done" id="done"></div><div class="knob" id="knob"></div>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline"></div></footer>

<div id="focus">
  <video id="fvid" muted playsinline></video>
  <div class="side"><div class="head"><span id="ftitle"></span><button id="fclose">Close</button></div><div class="list" id="flist"></div></div>
</div>

<main id="cam">
  <div id="camView">
    <div>
      <form id="srcForm"><input id="srcName" maxlength="40" placeholder="name" aria-label="Camera name"><input id="srcUrl" placeholder="http://PHONE_IP:8080/video  (IP Webcam app)" aria-label="Camera URL"><select id="srcRot" aria-label="Rotate" title="Phone held upright? Its stream is sideways: rotate 90°"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select><button>Add camera</button></form>
      <div id="srcMsg"></div>
    </div>
    <div id="camGrid"><div class="empty">No cameras yet. Add an IP camera above, or open /webcam to send a browser webcam.</div></div>
  </div>
  <div id="camSide">
    <div class="now"><div class="head" style="padding-left:0;padding-right:0"><span>Now</span><span id="camName" class="num"></span></div><div id="nowList"><div class="empty" style="padding-left:0">Nobody in view</div></div></div>
    <div class="rules"><div class="head" style="padding-left:0;padding-right:0"><span>Watch rules</span></div>
      <form id="ruleForm"><input id="ruleText" maxlength="300" placeholder="flag if a person raises their hand" aria-label="New watch rule"><button>Check</button></form>
      <div id="rulePv" class="pv"></div><div id="ruleList"></div></div>
    <div style="display:flex;flex-direction:column;min-height:0"><div class="head"><span>Log</span></div><div class="list" id="camLog"></div></div>
  </div>
</main>

<main id="clips">
  <div class="col"><div class="head"><span>Clips</span></div>
    <label id="drop">Drop a video to analyse<input id="file" type="file" accept="video/*" hidden></label>
    <div class="list" id="runlist"></div></div>
  <div id="player">Select a clip</div>
  <div class="col"><div class="head"><span>Events</span></div><div class="list" id="clipEvents"></div></div>
</main>

<main id="safe">
  <div id="safeSide" style="display:grid;grid-template-rows:auto minmax(0,1fr);border-right:1px solid var(--line);min-width:280px">
    <div class="head"><span>SafeWalk</span></div>
    <div style="padding:12px 16px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:8px">
        <button id="safeOrigin" style="flex:1;padding:8px;background:var(--hover);border:1px solid var(--line);color:var(--text);border-radius:4px">Set Origin</button>
        <button id="safeDest" style="flex:1;padding:8px;background:var(--hover);border:1px solid var(--line);color:var(--text);border-radius:4px">Set Destination</button>
      </div>
      <div id="safeMode" style="display:flex;gap:8px">
        <button class="on" data-mode="fastest" style="flex:1;padding:8px;background:var(--text);color:#000;border:0;border-radius:4px">Fastest</button>
        <button data-mode="safest" style="flex:1;padding:8px;background:var(--hover);border:1px solid var(--line);color:var(--text);border-radius:4px">Safest</button>
        <button data-mode="both" style="flex:1;padding:8px;background:var(--hover);border:1px solid var(--line);color:var(--text);border-radius:4px">Both</button>
      </div>
      <div id="safeHeatmap" style="display:flex;gap:8px">
        <label style="flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)">
          <input type="checkbox" id="hmDeserted" checked> Deserted
        </label>
        <label style="flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)">
          <input type="checkbox" id="hmDark"> Dark
        </label>
        <label style="flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)">
          <input type="checkbox" id="hmIncident"> Incidents
        </label>
      </div>
      <button id="safeGo" style="padding:10px;background:var(--text);color:#000;border:0;border-radius:4px;font-weight:600">Calculate Route</button>
      <div id="safeResult" style="font:11px var(--mono);color:var(--dim);min-height:40px"></div>
    </div>
    <div class="list" style="max-height:200px;overflow:auto" id="safeLegend"></div>
  </div>
  <div id="safeGlobe" style="position:relative;min-height:0;background:#000"></div>
</main>

<div id="toast"></div>
<div id="down">Hub unreachable<br>python -m angelseye.hub</div>

<script>
const NAMES = { fall: "Fall", sudden_run: "Sudden run", sos: "SOS", following: "Following", loitering: "Loitering", activity: "Activity", rule: "Rule" };
const isAlert = (e) => e.type !== "loitering" && e.type !== "activity";
const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hms = (d) => d.toTimeString().slice(0, 8);
async function j(url, opt) { const r = await fetch(url, opt); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }

let tiles = {}, events = [], siteStart = 0, siteEnd = 1, T = 0, playing = true, speed = 1;
let shown = new Set(), focusCam = null, viewer = null, dotEnts = {}, pinEnts = {}, coneEnts = {}, trackData = {}, audio = null;
const W = () => Cesium.Color.WHITE;

// ---------------- boot ----------------
async function boot() {
  let reg, evs, cfg;
  try { [reg, evs, cfg] = await Promise.all([j("/api/cameras"), j("/api/events"), j("/api/config")]); }
  catch { $("#down").style.display = "grid"; return; }
  const live = reg.cameras.filter((c) => c.run);
  if (live.length) {
    siteStart = Math.min(...live.map((c) => +new Date(c.run.start)));
    siteEnd = Math.max(...live.map((c) => (+new Date(c.run.start) - siteStart) / 1000 + c.run.duration_s));
  }
  const siteIds = new Set(live.map((c) => c.id));
  events = evs.filter((e) => siteIds.has(e.camera)).map(withTimes);
  buildGrid(live);
  buildTimeline();
  initGlobe(reg, cfg.cesium_token).catch((e) => ($("#globeNote").textContent = "map unavailable: " + e.message));
  for (const c of live) j(`/api/tracks/${c.id}`).then((d) => (trackData[c.id] = d)).catch(() => {});
  connectWS(siteIds);
  initClips(siteIds, evs);
  requestAnimationFrame(tick);
}
const withTimes = (e) => ({ ...e, s: (+new Date(e.t_start) - siteStart) / 1000, e: (+new Date(e.t_end) - siteStart) / 1000 });

// ---------------- grid ----------------
function buildGrid(live) {
  const g = $("#grid");
  g.style.gridTemplateColumns = `repeat(${Math.ceil(Math.sqrt(live.length || 1))}, minmax(0, 1fr))`;
  for (const c of live) {
    const t = el("div", "tile", `<video muted playsinline preload="auto" src="${c.run.video_url}"></video>
      <div class="cap"><b>${esc(c.id)}</b><span class="pc num"></span></div>`);
    t.onclick = () => openFocus(c.id);
    g.append(t);
    tiles[c.id] = { el: t, v: t.querySelector("video"), pc: t.querySelector(".pc"), cam: c,
      off: (+new Date(c.run.start) - siteStart) / 1000, dur: c.run.duration_s };
  }
}

function syncVideo(v, local, dur) {
  if (local < 0 || local >= dur) { if (!v.paused) v.pause(); return false; }
  if (v.readyState >= 1 && Math.abs(v.currentTime - local) > 0.6) v.currentTime = local;
  if (v.playbackRate !== speed) v.playbackRate = speed;
  if (playing && v.paused) v.play().catch(() => {});
  if (!playing && !v.paused) v.pause();
  return true;
}

// ---------------- clock ----------------
let last = performance.now(), lastSlow = 0;
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.5); last = now;
  if (playing) { T += dt * speed; if (T >= siteEnd) T = 0; }
  for (const id in tiles) {
    const tl = tiles[id];
    tl.el.classList.toggle("off", !syncVideo(tl.v, T - tl.off, tl.dur));
    tl.el.classList.toggle("alert", events.some((e) => e.camera === id && isAlert(e) && T >= e.s && T <= e.e + 3));
  }
  if (focusCam) syncVideo($("#fvid"), T - tiles[focusCam].off, tiles[focusCam].dur);
  $("#clock").textContent = siteStart ? hms(new Date(siteStart + T * 1000)) : "--:--:--";
  const p = (T / siteEnd * 100) + "%";
  $("#knob").style.left = p; $("#done").style.width = p;
  if (now - lastSlow > 200) { lastSlow = now; reveal(); updateDots(); }
  requestAnimationFrame(tick);
}

function seek(t) { T = Math.max(0, Math.min(t, siteEnd)); for (const id in tiles) tiles[id].v.currentTime = Math.max(0, T - tiles[id].off); reveal(true); }
function setPlaying(p) { playing = p; $("#playIcon").setAttribute("d", p ? "M2 1h3v10H2zM7 1h3v10H7z" : "M2 1l9 5-9 5z"); }
$("#play").onclick = () => setPlaying(!playing);
$("#spd").onclick = () => { speed = speed >= 8 ? 1 : speed * 2; $("#spd").textContent = speed + "×"; };
$("#scrub").oninput = (e) => seek(e.target.value / 1000 * siteEnd);

function buildTimeline() {
  $("#track").querySelectorAll(".tick").forEach((x) => x.remove());
  for (const e of events) {
    const k = el("div", "tick" + (isAlert(e) ? " alert" : ""));
    k.style.left = (e.s / siteEnd * 100) + "%";
    $("#track").append(k);
  }
}

// ---------------- events ----------------
function evRow(e, onclick) {
  const kf = e.evidence.keyframes[0];
  const d = el("div", "ev" + (isAlert(e) ? "" : " watch"),
    `<img src="${kf ? "/media/" + esc(kf) : ""}" alt="">
     <div><div class="t">${NAMES[e.type]}</div><div class="m">${esc(e.camera)} · P${e.track_ids.join(" → P")} · ${esc(e.t_start.slice(11, 19))}</div></div>
     <div class="c">${Math.round(e.confidence * 100)}%</div>`);
  d.onclick = onclick;
  return d;
}

function reveal(quiet) {
  const vis = events.filter((e) => e.s <= T).sort((a, b) => b.s - a.s);
  const key = vis.map((e) => e.id).join();
  if (key === reveal.key) return;
  reveal.key = key;
  const list = $("#feedlist");
  list.replaceChildren();
  if (!vis.length) list.append(el("div", "empty", "Nothing yet"));
  for (const e of vis) {
    const row = evRow(e, () => jumpTo(e));
    if (!shown.has(e.id)) { shown.add(e.id); if (!quiet && playing && T - e.s < 2) { row.classList.add("new"); alarm(e); } }
    list.append(row);
  }
  for (const id of shown) if (!vis.some((e) => e.id === id)) shown.delete(id);
  $("#evCount").textContent = `${vis.length}/${events.length}`;
  for (const e of events) if (pinEnts[e.id]) pinEnts[e.id].show = e.s <= T;
}

function alarm(e) {
  if (!isAlert(e)) return;
  const t = el("div", "", `${NAMES[e.type]} · ${esc(e.camera)} · P${e.track_ids.join(" → P")}`);
  $("#toast").append(t);
  setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, 3500);
  if (audio) { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .05;
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .15); }
}
document.addEventListener("pointerdown", () => { audio = audio || new AudioContext(); }, { once: true });

function jumpTo(e) {
  seek(e.s - 3);
  openFocus(e.camera);
  if (viewer && e.geo) viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(e.geo[1], e.geo[0] - 0.0012, 260),
    orientation: { pitch: Cesium.Math.toRadians(-55) }, duration: 1.1 });
}

function openFocus(cam) {
  const tl = tiles[cam];

  focusCam = cam;

  if (!v.src.endsWith(tl.cam.run.video_url)) v.src = tl.cam.run.video_url;
  v.currentTime = Math.max(0, T - tl.off);
  $("#ftitle").textContent = tl.cam.id;
  const list = $("#flist");
  list.replaceChildren();
  const evs = events.filter((e) => e.camera === cam);
  if (!evs.length) list.append(el("div", "empty", "No events on this camera"));
  for (const e of evs) list.append(evRow(e, () => seek(e.s - 3)));
  $("#focus").classList.add("show");
}
function closeFocus() { focusCam = null; $("#focus").classList.remove("show"); $("#fvid").pause(); }
$("#fclose").onclick = closeFocus;
document.addEventListener("keydown", (k) => {

function connectWS(siteIds) {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => $("#dot").classList.add("ok");
  ws.onclose = () => { $("#dot").classList.remove("ok"); setTimeout(() => connectWS(siteIds), 2000); };

    if (siteIds.has(e.camera)) {
      const ev = withTimes(e);
      events = events.filter((x) => x.id !== e.id).concat([ev]);
      buildTimeline(); reveal.key = null; addPin(ev);

async function initGlobe(reg, token) {
  const opts = { animation: false, timeline: false, baseLayerPicker: false, geocoder: false, homeButton: false,

    skyBox: false, skyAtmosphere: false, contextOptions: { webgl: { alpha: false } } };
  // An ion token can be restricted to certain page addresses; check before relying on it.
  const ionOk = token && await fetch(`https://api.cesium.com/v1/assets/1/endpoint?access_token=${token}`).then((r) => r.ok).catch(() => false);
  if (ionOk) { Cesium.Ion.defaultAccessToken = token; opts.terrain = Cesium.Terrain.fromWorldTerrain(); }
  else opts.baseLayer = new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
    url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", maximumLevel: 19 }));
  viewer = new Cesium.Viewer("globe", opts);
  const sc = viewer.scene;
  sc.backgroundColor = Cesium.Color.BLACK;
  for (const k of ["sun", "moon", "skyBox", "skyAtmosphere"]) if (sc[k]) sc[k].show = false;
  sc.fog.enabled = false;
  sc.globe.baseColor = Cesium.Color.BLACK; sc.globe.showGroundAtmosphere = false; sc.globe.enableLighting = false;
  const base = viewer.imageryLayers.get(0);
  if (base) { base.saturation = 0; base.brightness = 0.75; base.contrast = 1.15; }
  $("#globeNote").textContent = "Imagery © Esri, Maxar" + (ionOk ? " · terrain Cesium ion" : "");

  for (const c of reg.cameras) {
    const has = !!c.run;
    coneEnts[c.id] = viewer.entities.add({
      polygon: { hierarchy: Cesium.Cartesian3.fromDegreesArray(c.footprint.flatMap(([la, lo]) => [lo, la])),
        material: W().withAlpha(has ? 0.12 : 0.04) } });
    if (has) viewer.entities.add({ polyline: { width: 1, clampToGround: true, material: W().withAlpha(0.45),
      positions: Cesium.Cartesian3.fromDegreesArray([...c.footprint, c.footprint[0]].flatMap(([la, lo]) => [lo, la])) } });
    viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(c.lon, c.lat), properties: { kind: "cam", id: c.id },
      point: { pixelSize: has ? 7 : 4, color: has ? W() : W().withAlpha(.4), outlineColor: Cesium.Color.BLACK, outlineWidth: 1,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity },
      label: { show: has, text: c.id, font: "10px monospace", pixelOffset: new Cesium.Cartesian2(0, -13), fillColor: W(),
        showBackground: true, backgroundColor: Cesium.Color.BLACK.withAlpha(.55), backgroundPadding: new Cesium.Cartesian2(4, 2),
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity } });
  }
  for (const e of events) addPin(e);
  const lat = reg.cameras.reduce((a, c) => a + c.lat, 0) / reg.cameras.length;
  const lon = reg.cameras.reduce((a, c) => a + c.lon, 0) / reg.cameras.length;
  const home = (d = 1.4) => viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(lon, lat - 0.0028, ionOk ? 560 : 360),
    orientation: { pitch: Cesium.Math.toRadians(-52) }, duration: d });
  home(0);
  $("#home").onclick = () => home();
  new Cesium.ScreenSpaceEventHandler(sc.canvas).setInputAction((m) => {
    const p = sc.pick(m.position), props = p && p.id && p.id.properties;
    if (!props) return;
    if (props.kind.getValue() === "cam") openFocus(props.id.getValue());
    else { const e = events.find((x) => x.id === props.id.getValue()); if (e) jumpTo(e); }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}

function addPin(e) {
  if (!viewer || !e.geo) return;
  if (pinEnts[e.id]) viewer.entities.remove(pinEnts[e.id]);
  const a = isAlert(e);
  pinEnts[e.id] = viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(e.geo[1], e.geo[0]), show: e.s <= T,
    properties: { kind: "event", id: e.id },
    point: { pixelSize: a ? 14 : 10, color: Cesium.Color.TRANSPARENT, outlineColor: a ? W() : W().withAlpha(.5), outlineWidth: a ? 2 : 1,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity } });
}

function updateDots() {
  if (!viewer) return;
  const seen = new Set();
  for (const id in tiles) {
    const d = trackData[id], tl = tiles[id];
    const fr = d ? d.frames[Math.round((T - tl.off) * d.hz)] || [] : [];
    tl.pc.textContent = d && fr.length ? `${fr.length} ${fr.length === 1 ? "person" : "people"}` : "";
    for (const [pid, la, lo, label, flagged] of fr) {
      const key = id + ":" + pid;
      seen.add(key);
      let ent = dotEnts[key];
      if (!ent) ent = dotEnts[key] = viewer.entities.add({ point: { pixelSize: 6, color: W(), outlineColor: Cesium.Color.BLACK,
        outlineWidth: 1, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity } });
      ent.position = Cesium.Cartesian3.fromDegrees(lo, la);
      ent.point.pixelSize = flagged ? 9 : 6;
      ent.show = true;
    }
    if (coneEnts[id]) coneEnts[id].polygon.material = W().withAlpha(tl.el.classList.contains("alert") ? .4 : .14);
  }
  for (const k in dotEnts) if (!seen.has(k)) dotEnts[k].show = false;
}

async function upload(file) {
  const fd = new FormData(); fd.append("file", file);

  d.textContent = `Uploading ${file.name}`;
  try {
    const { job, run } = await j("/api/upload", { method: "POST", body: fd });

    const poll = setInterval(async () => {
      const s = await j(`/api/jobs/${job}`).catch(() => ({ status: "failed", log: "hub unreachable" }));

        selectRun(run);

}

// The log only ever grows at the top; rows are created once and updated in place.
let camName = null, camSession = null, camEvents = {}, camRows = {}, camMiss = 0;
const inSession = (e) => camSession && e.id.startsWith(camSession + "-");
const camT = (iso) => iso.slice(11, 19);
function pickCam(name) {
  camName = name; camSession = null; camEvents = {}; camRows = {};
  $("#camName").textContent = name; $("#camLog").replaceChildren(); renderNow([]);
  for (const t of document.querySelectorAll(".tile")) t.classList.toggle("sel", t.dataset.name === name);
}
async function pollCam() {
  const list = await j("/api/live").catch(() => null);
  if (list === null) return;                       // hub hiccup: keep what is on screen
  const grid = $("#camGrid"), seen = new Set(list.map((c) => c.name));
  for (const c of list) {                          // one tile per live camera, created once
    let t = grid.querySelector(`.tile[data-name="${CSS.escape(c.name)}"]`);
    if (!t) {
      grid.querySelector(".empty")?.remove();
      t = el("div", "tile", `<img src="/api/live/${encodeURIComponent(c.name)}/stream" alt=""><span class="lab">${esc(c.name)}</span><button>Remove</button>`);
      t.dataset.name = c.name;
      t.onclick = () => pickCam(c.name);
      t.querySelector("button").onclick = async (ev) => {
        ev.stopPropagation();
        const r = await fetch(`/api/sources/${encodeURIComponent(c.name)}`, { method: "DELETE" });
        $("#srcMsg").textContent = r.ok ? "" : (await r.json().catch(() => ({}))).detail || "could not remove";
      };
      grid.append(t);
    }
    t.dataset.miss = 0;
  }
  for (const t of [...grid.querySelectorAll(".tile")])
    if (!seen.has(t.dataset.name) && (t.dataset.miss = +t.dataset.miss + 1) > 3) t.remove();
  if (!grid.children.length) grid.append(el("div", "empty", "No cameras yet. Add an IP camera above, or open /webcam to send a browser webcam."));
  if (camName && !grid.querySelector(`.tile[data-name="${CSS.escape(camName)}"]`)) {
    camName = null; camSession = null; $("#camName").textContent = ""; $("#camLog").replaceChildren(); renderNow([]);
  }
  if (!camName && list[0]) pickCam(list[0].name);
  const cam = list.find((c) => c.name === camName);
  if (cam) renderNow(cam.people || []);
  if (!cam || cam.session === camSession) return;  // same session: nothing to do
  camSession = cam.session;
  const evs = (await j(`/api/events?camera=${encodeURIComponent(cam.name)}`).catch(() => []))
    .filter(inSession).sort((a, b) => (a.t_start < b.t_start ? -1 : 1));
  for (const e of evs) camUpsert(e, false);
}
$("#srcForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const r = await fetch("/api/sources", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: $("#srcName").value.trim(), url: $("#srcUrl").value.trim(), rotate: +$("#srcRot").value }) });
  const msg = r.ok ? "Starting… the tile appears in about 30 s." : (await r.json().catch(() => ({}))).detail || "could not add";
  $("#srcMsg").textContent = typeof msg === "string" ? msg : "Check the name and the URL";

};
function camText(e) {
  if (e.type === "activity") return e.evidence.series.caption;
  return e.type === "rule" ? `Rule: ${e.evidence.series.rule_text}` : NAMES[e.type];
}
function camUpsert(e, animate) {
  camEvents[e.id] = e;
  let row = camRows[e.id];
  if (!row) {
    row = camRows[e.id] = el("div", "log" + (e.type !== "activity" ? " alert" : ""));
    if (!animate) row.style.animation = "none";
    $("#camLog").prepend(row);
  }
  row.innerHTML = `<span class="tm">${camT(e.t_start)}</span><span class="p">P${e.track_ids.join(",")}</span><span>${esc(camText(e))}</span>`;
}
function onCamEvent(e) {
  if (e.camera !== camName) return false;
  if (!inSession(e)) return true;  // an older session of this camera: not shown
  const fresh = !camEvents[e.id];
  camUpsert(e, fresh);
  if (fresh && isAlert(e)) alarm(e);
  return true;
}
function renderNow(people) {
  // one tile per person in view, sent by the engine with each frame; keyed by subject so a tracker ID switch keeps the tile
  const box = $("#nowList");

      `<span class="s">since ${esc(p.since)}</span>`;

}

  }

  // Heatmap checkboxes
  for (const id of ["hmDeserted", "hmDark", "hmIncident"]) {
    $(`#${id}`).onchange = () => updateHeatmap();
  }

  // Go button
  $("#safeGo").onclick = async () => {
    if (!safeOrigin || !safeDest) {
      $("#safeResult").textContent = "Set both origin and destination first";
      return;
    }
    await calculateRoute();
  };
}

function clearSafeRoutes() {
  if (!safeViewer) return;
  for (const e of safeViewer.entities.values()) {
    if (e.properties?.kind?.getValue() === "route") safeViewer.entities.remove(e);
  }
  for (const layer of Object.values(safeHeatLayers)) {
    if (layer) { safeViewer.imageryLayers.remove(layer, true); safeHeatLayers[layer] = null; }
  }
  $("#safeResult").textContent = "";
}

async function calculateRoute() {
  clearSafeRoutes();
  $("#safeResult").textContent = "Calculating...";
  try {
    const res = await j(`/api/safewalk?origin_lat=${safeOrigin.lat}&origin_lon=${safeOrigin.lon}&dest_lat=${safeDest.lat}&dest_lon=${safeDest.lon}`);
    drawRoute(res.fastest, Cesium.Color.GREY, "fastest");
    drawRoute(res.safest, Cesium.Color.LIME, "safest");
    drawHeatmap(res.heatmap);
    const fastLen = pathLength(res.fastest);
    const safeLen = pathLength(res.safest);
    $("#safeResult").innerHTML = `Fastest: ${fastLen.toFixed(1)} km<br>Safest: ${safeLen.toFixed(1)} km<br>Detour: ${((safeLen - fastLen) / fastLen * 100).toFixed(1)}%`;
  } catch (e) {
    $("#safeResult").textContent = "Route failed: " + e.message;
  }
}

function drawRoute(coords, color, kind) {
  if (!safeViewer || !coords?.length) return;
  const positions = coords.flatMap(([la, lo]) => [lo, la, 10]);
  safeViewer.entities.add({
    polyline: {positions: Cesium.Cartesian3.fromDegreesArrayHeights(positions), width: 4, material: color, clampToGround: true},
    properties: {kind: "route", type: kind}
  });
  // Start/end markers
  const [sla, slo] = coords[0];
  const [ela, elo] = coords[coords.length - 1];
  safeViewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(slo, sla, 20),
    point: {pixelSize: 10, color: color, outlineColor: Cesium.Color.BLACK, outlineWidth: 2},
    label: {text: kind === "fastest" ? "Start (Fast)" : "Start (Safe)", font: "11px monospace", fillColor: color, pixelOffset: new Cesium.Cartesian2(0, -18)}
  });
  safeViewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(elo, ela, 20),
    point: {pixelSize: 10, color: color, outlineColor: Cesium.Color.BLACK, outlineWidth: 2},
    label: {text: "Destination", font: "11px monospace", fillColor: color, pixelOffset: new Cesium.Cartesian2(0, -18)}
  });
  // Fly to route
  safeViewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(slo, sla, 500),
    orientation: {pitch: Cesium.Math.toRadians(-45)}, duration: 1.5
  });
}

function pathLength(coords) {
  if (!coords?.length) return 0;
  let d = 0;
  for (let i = 1; i < coords.length; i++) {
    const [la1, lo1] = coords[i-1], [la2, lo2] = coords[i];
    const R = 6371;
    const phi1 = la1 * Math.PI / 180, phi2 = la2 * Math.PI / 180;
    const dphi = (la2 - la1) * Math.PI / 180, dlambda = (lo2 - lo1) * Math.PI / 180;
    const a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dlambda/2)**2;
    d += 2 * R * Math.asin(Math.sqrt(a));
  }
  return d;
}

function drawHeatmap(hm) {
  if (!safeViewer || !hm) return;
  // For now, just log - proper heatmap would need custom imagery provider
  console.log("Heatmap data:", Object.keys(hm).map(k => `${k}: ${hm[k].length} edges`));
  // Build legend
  const box = $("#safeLegend");
  box.replaceChildren();
  for (const [name, color] of [["Deserted", "#888"], ["Dark", "#444"], ["Incident", "#f88"], ["Total", "#fff"]]) {
    const row = el("div", "", `<span style="display:inline-block;width:12px;height:12px;background:${color};margin-right:8px"></span>${name}`);
    box.append(row);
  }
}

async function updateHeatmap() {
  // Recalculate route to refresh heatmap
  if (safeOrigin && safeDest) await calculateRoute();
}

$$ = (s) => Array.from(document.querySelectorAll(s));

tab("cam");

boot();
</script>
</body>
