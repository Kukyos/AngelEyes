<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alerts</title>
<style>
:root { --line: #1c1c1c; --text: #f2f2f2; --dim: #8a8a8a; --faint: #4a4a4a; --mono: ui-monospace, Consolas, monospace; }
* { box-sizing: border-box; margin: 0; }
body { background: #000; color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
header { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; background: #000; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim); }
#dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .3s; }
#dot.ok { background: var(--text); }
main { max-width: 640px; margin: 0 auto; }
.card { border-bottom: 1px solid var(--line); }
.card.new { animation: in .6s cubic-bezier(.2, .7, .2, 1); }
@keyframes in { from { opacity: 0; transform: translateY(-8px); background: #1a1a1a; } }
.card img { width: 100%; display: block; background: #0a0a0a; filter: grayscale(1); }
.body { padding: 12px 16px 14px; }
.t { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.m { font: 12px var(--mono); color: var(--dim); margin-top: 3px; }
.a { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; }
.a a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--faint); }
.empty { color: var(--faint); text-align: center; padding: 48px 0; font-size: 13px; }
</style>
</head>
<body>
<header><span>Alerts</span><span id="dot"></span></header>
<main id="list"><div class="empty">Waiting for alerts</div></main>
<script>
const NAMES = { fall: "Fall", sudden_run: "Sudden run", sos: "SOS", following: "Following" };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = document.getElementById("list"), cards = {};

function card(e) {
  const d = cards[e.id] || (cards[e.id] = Object.assign(document.createElement("div"), { className: "card" }));
  const kf = e.evidence.keyframes[0];
  d.innerHTML = `${kf ? `<img src="/media/${esc(kf)}" alt="">` : ""}
    <div class="body"><div class="t">${NAMES[e.type]}</div>
    <div class="m">${esc(e.camera)} · P${e.track_ids.join(" → P")} · ${Math.round(e.confidence * 100)}%</div>
    <div class="m">${esc(e.t_start.replace("T", " ").slice(0, 19))}</div>
    <div class="a"><a href="/media/${esc(e.clip_path)}" target="_blank" rel="noopener">Clip</a>
    ${e.geo ? `<a href="https://www.google.com/maps?q=${e.geo[0]},${e.geo[1]}" target="_blank" rel="noopener">Map</a>` : ""}</div></div>`;
  return d;
}

fetch("/api/events").then((r) => r.json()).then((evs) => {
  evs = evs.filter((e) => NAMES[e.type]).sort((a, b) => (a.t_start < b.t_start ? 1 : -1)).slice(0, 50);
  if (evs.length) list.replaceChildren(...evs.map(card));
}).catch(() => (list.innerHTML = '<div class="empty">Hub unreachable</div>'));

(function ws() {
  const s = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  s.onopen = () => document.getElementById("dot").classList.add("ok");
  s.onclose = () => { document.getElementById("dot").classList.remove("ok"); setTimeout(ws, 2000); };
  s.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (!NAMES[e.type]) return;
    const fresh = !cards[e.id];
    list.querySelector(".empty")?.remove();
    const c = card(e);
    if (fresh) { c.classList.add("new"); list.prepend(c); navigator.vibrate?.([200, 100, 200]); }
  };
})();
</script>
</body>
</html>
